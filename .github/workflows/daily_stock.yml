name: Daily Stock Message

on:
  schedule:
    # 台灣時間週一至週五 15:30
    # GitHub Actions 使用 UTC
    # 台灣 15:30 = UTC 07:30
    - cron: '30 7 * * 1-5'

  # 允許在 GitHub Actions 頁面手動執行
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. 下載 GitHub Repository 程式碼
      # ==========================================
      - name: 檢出程式碼
        uses: actions/checkout@v4


      # ==========================================
      # 2. 設定 Python
      # ==========================================
      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ==========================================
      # 3. 安裝 Python 套件
      # ==========================================
      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # 4. 執行主程式
      # ==========================================
      - name: 執行推播主程式
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python main.py
